# Builds the iOS app on EAS and uploads it to TestFlight. No Mac needed.
#
# Runs on every push to main (except docs-only changes) and from the Actions tab ("Run workflow").
# One-time GitHub secrets (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN      expo.dev → Account settings → Access tokens
#   ASC_KEY_ID      App Store Connect → Users and Access → Integrations → App Store Connect API (Admin key)
#   ASC_ISSUER_ID   shown above the key list on the same page
#   ASC_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
# On the first run this workflow links the Expo project and creates the signing certificate and
# provisioning profile itself, and commits them (encrypted) back to main.
name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for s in EXPO_TOKEN ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (see the top of .github/workflows/testflight.yml)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Link Expo project (first run only)
        run: |
          if node -e 'process.exit(require("./app.json").expo.extra?.eas?.projectId ? 0 : 1)'; then
            echo "Expo project already linked."
          else
            eas init --non-interactive --force
            echo "LINKED=1" >> "$GITHUB_ENV"
          fi

      - name: Create signing credentials (first run only)
        run: node scripts/ios-credentials.mjs bootstrap

      - name: Save first-run setup to the repo
        run: |
          git add app.json credentials/ios.enc
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Link Expo project and add encrypted iOS signing credentials [skip ci]"
            git push
          fi

      - name: Prepare credentials and submit config
        run: |
          node scripts/ios-credentials.mjs restore
          printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > credentials/asc-api-key.p8
          ASC_APP_ID=$(node scripts/ios-credentials.mjs app-id)
          node -e '
            const fs = require("fs");
            const e = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            e.submit.production.ios = {
              ascAppId: process.argv[1],
              ascApiKeyPath: "./credentials/asc-api-key.p8",
              ascApiKeyId: process.env.ASC_KEY_ID,
              ascApiKeyIssuerId: process.env.ASC_ISSUER_ID,
            };
            e.build.production.credentialsSource = "local";
            fs.writeFileSync("eas.json", JSON.stringify(e, null, 2));
          ' "$ASC_APP_ID"

      - name: Build on EAS
        id: build
        run: |
          eas build --platform ios --profile production --non-interactive --wait --json > build.json
          BUILD_ID=$(node -p 'require("./build.json")[0].id')
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build: https://expo.dev/accounts/$(eas whoami | head -1)/projects/stremie/builds/$BUILD_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Submit to TestFlight
        run: eas submit --platform ios --profile production --id "${{ steps.build.outputs.id }}" --non-interactive --wait

      - name: Summary
        run: echo "Uploaded to App Store Connect. It shows up in TestFlight after Apple finishes processing (usually 5 to 15 minutes)." >> "$GITHUB_STEP_SUMMARY"
